version: '3.9'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pedidos360-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: 8080
    networks:
      - pedidos360-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/orders/health"]
      interval: 30s
      timeout: 3s
      retries: 3

  frontend:
    image: node:22-alpine
    container_name: pedidos360-frontend
    working_dir: /app
    command: npm start
    ports:
      - "4200:4200"
    volumes:
      - ./frontend/pedidos360-app:/app
    environment:
      - PORT=4200
    networks:
      - pedidos360-network
    depends_on:
      - backend

networks:
  pedidos360-network:
    driver: bridge
